[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "py-one2html"
version = "1.3.1"
requires-python = ">=3.13"

[tool.maturin]
module-name = "py_one2html"
# Default features include `backtrace` (nightly-only rustc feature via
# onenote_parser) and `bin` (CLI). Build only the extension module on stable.
no-default-features = true
features = ["python"]
