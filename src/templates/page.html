<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="X-Original-Page-Id" content="{{ page_id_attr }}"/>
    <meta name="X-Created-Time" content="{{ created_date_attr }}"/>
    <meta name="X-Updated-Time" content="{{ updated_date_attr }}"/>
    <title>{{ name }}</title>
    <style>
    /*** Start default CSS ***/
    * { margin: 0; padding: 0; font-weight: normal; }
    table, tr, td { border-color: #A3A3A3; }
    ul, ol { padding: 0; }
    .title .outline-element { display: inline; }
    .title .outline-element:nth-child(2) { margin-left: 10px !important; }
    .container-outline { font-family: Calibri, sans-serif; font-size: 6pt; }
    .ink-text, .ink-space { display: inline-block; position: relative; vertical-align: bottom; }
    .ink-text { top: 0; left: 0; }
    .note-tag-icon {
        position: relative;
        --note-tag-left: -23px;
        --note-tag-font-size: 16px;
    }
    .note-tag-icon.-large { --note-tag-left: -25px; --note-tag-font-size: 20px; }
    .note-tag-icon > svg, .note-tag-icon > img { position: absolute; }
    .note-tag-icon > .text {
        position: absolute;
        left: var(--note-tag-left);
        font-size: var(--note-tag-font-size);
    }
    .note-tag-icon.-checkbox > .text { bottom: -0.2em; }
    .icon-secondary > svg, .icon-secondary > img, .icon-secondary > .content {
        position: absolute;
        fill: black;
        color: black;
        filter: drop-shadow(0 0 2px white);
        height: 12px;
        top: -1px;
    }
    .icon-secondary > .content { height: auto; font-size: 10px; user-select: none; }
    /*** End default CSS ***/

    {% for entry in global_styles -%}
    {{ entry.0 }} { {{ entry.1 }} }
    {% endfor %}
    </style>
</head>
<body>

{{ content }}

<script>
    if (window.parent !== null) {
        window.parent.postMessage(window.location.href, '*');
    }
</script>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
{% match options.math_target %}
{% when crate::MathTarget::MathML %}
<script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@4/mml-chtml.js"></script>
{% when crate::MathTarget::LaTeX %}
<script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
{% endmatch %}
</body>
</html>
