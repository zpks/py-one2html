[package]
name = "one2html"
version = "1.3.0"
authors = ["Markus Siemens <markus@m-siemens.de>"]
edition = "2024"
description = "Convert Microsoft OneNote® notebooks to HTML"
license = "MIT"
repository = "https://github.com/msiemens/one2html"
keywords = ["onenote"]
categories = ["command-line-utilities", "encoding"]

[features]
default = ["backtrace", "native-fs", "bin", "onepkg"]

bin = [
    "native-fs",
    "dep:clap",
    "dep:console",
    "dep:indicatif",
    "dep:simplelog",
]
backtrace = ["onenote_parser/backtrace"]
native-fs = ["onenote_parser/native-fs"]
onepkg = ["onenote_parser/onepkg"]

[dependencies]
askama = "0.15"
color-eyre = "0.6"
console = { version = "0.16", optional = true }
indicatif = { version = "0.18", optional = true }
itertools = "0.14"
log = "0.4"
mime_guess = "2.0"
once_cell = "1.21"
onenote_parser = { version = "1.1", default-features = false }
palette = "0.7"
percent-encoding = "2.3"
regex = "1.12"
sanitize-filename = "0.6"
clap = { version = "4.5", features = ["derive"], optional = true }
bitflags = "2.10"
enum-primitive-derive = "0.3"
unicode-blocks = "0.1"
phf = { version = "0.13", features = ["macros"] }
num-traits = "0.2"
finl_unicode = "1.4"
simplelog = { version = "0.12", optional = true }

[profile.dev.package.backtrace]
opt-level = 3

[patch.crates-io]
onenote_parser = { git = "https://github.com/msiemens/onenote.rs", branch = "joplin-merge" }
